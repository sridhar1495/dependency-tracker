#
# Dependency-Track Risk Dashboard — Docker Compose
# Serves the dashboard, the multi-user backend and its PostgreSQL database.
#
# There is no service-wide DependencyTrack connection: each account stores its
# own URL and API key, encrypted, in the database, and the backend proxies
# DependencyTrack calls on that user's behalf (CLAUDE.md §7.6).
#

networks:
  dependency-track:
    driver: bridge

services:

  # ─── Custom Risk Dashboard ────────────────────────────────────────────────────
  dt-dashboard:
    image: nginx:alpine
    container_name: dt-dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # nginx serves the two static pages and proxies /auth, /profile and
    # /violation-cache to the backend. It no longer proxies DependencyTrack —
    # that is per-user and goes through /violation-cache/dt/.
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      # nginx:alpine's entrypoint runs envsubst on *.template files in this dir
      # and writes the result to /etc/nginx/conf.d/ at container startup.
      - ./dashboard/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${DT_DASHBOARD_PORT:-3000}:80"
    networks:
      - dependency-track

  # ─── Violation Cache Service ──────────────────────────────────────────────────
  # Authentication, per-user configuration, reports, the scheduler and the shared
  # violation cache.
  #
  # The violation cache is keyed by a fingerprint of the DependencyTrack
  # connection rather than by user, so accounts sharing one DT instance share a
  # single crawl (CLAUDE.md §7.5).
  dt-violation-cache:
    build:
      context: ./violation-cache
    container_name: dt-violation-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/violation-cache/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      # How many hours a cached violation map is valid before auto-expiry.
      CACHE_TTL_HOURS: "${VIOLATION_CACHE_TTL_HOURS:-24}"
      PORT: "3001"
      # AES-256-GCM key for stored DT API keys and SMTP passwords. The service
      # refuses to start without it — a key saved under a missing encryption key
      # could never be read back.
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY must be set in .env — run ./install.sh to generate one}"
      # Legacy single-tenant connection, read ONCE at first boot to seed existing
      # accounts. Safe to remove after upgrading; ignored on a fresh install.
      DT_API_URL: "${DT_API_INTERNAL_URL:-}"
      DT_API_KEY: "${DT_API_KEY:-}"
      DT_FRONTEND_URL: "${DT_FRONTEND_URL:-}"
      # ─── Database connection ──────────────────────────────────────────────
      # The service refuses to start if it cannot reach PostgreSQL: migrations
      # must complete before the HTTP listener opens.
      POSTGRES_HOST: "dt-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-dtdash}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — run ./install.sh to generate one}"
      POSTGRES_DB: "${POSTGRES_DB:-dtdash}"
      SESSION_ABSOLUTE_HOURS: "${SESSION_ABSOLUTE_HOURS:-8}"
      SESSION_IDLE_HOURS: "${SESSION_IDLE_HOURS:-2}"
    depends_on:
      dt-postgres:
        condition: service_healthy
    volumes:
      # Holds admin-credentials.json and nothing else — caches, reports and all
      # configuration live in PostgreSQL now (CLAUDE.md §5.6).
      - ./violation-cache/data:/data
      # Read-only: the service reads .env once at boot to migrate a legacy
      # single-tenant connection. It never writes to it.
      - ./.env:/app/.env:ro
    networks:
      - dependency-track

  # ─── PostgreSQL — system of record ────────────────────────────────────────────
  # Holds users, sessions, per-user configuration and reports as the multi-user
  # migration lands. Phase 0 creates the service, the migration ledger and the
  # citext extension; application tables arrive in phase 1.
  #
  # The data directory is a BIND MOUNT, not a named volume, and this is
  # deliberate: install.sh runs `docker compose down -v` unconditionally on
  # uninstall, which would silently destroy a named volume (CLAUDE.md §9.2).
  dt-postgres:
    image: postgres:16-alpine
    container_name: dt-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtdash} -d ${POSTGRES_DB:-dtdash}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-dtdash}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — run ./install.sh to generate one}"
      POSTGRES_DB: "${POSTGRES_DB:-dtdash}"
      # Deterministic collation regardless of the host locale, so index ordering
      # is stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Tuning is passed as flags so the whole configuration is visible here and
    # needs no mounted postgresql.conf. Sized for a ~1 GB container allocation.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c log_min_duration_statement=500ms
    ports:
      # Exposed so administrators can attach pgAdmin/DBeaver from outside Docker.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./violation-cache/pgdata:/var/lib/postgresql/data
    networks:
      - dependency-track

  # ─── SMTP Relay (Option C1 — internal relay, no credentials needed from app) ──
  # Uncomment this service to use a self-hosted SMTP relay.
  # The violation-cache service connects to smtp-relay:25 with no authentication;
  # the relay handles outbound delivery via the upstream SMTP server configured below.
  #
  # In ⚙ Settings, set:
  #   Host: smtp-relay   Port: 25   TLS: off   Username: (blank)   Password: (blank)
  #
  # smtp-relay:
  #   image: boky/postfix:latest
  #   container_name: dt-smtp-relay
  #   restart: unless-stopped
  #   environment:
  #     # Upstream SMTP server that will deliver the mail outbound.
  #     # Format: "[hostname]:port"  (brackets prevent MX lookup)
  #     RELAYHOST: "[smtp.yourprovider.com]:587"
  #     RELAYHOST_USERNAME: "relay-user@yourprovider.com"
  #     RELAYHOST_PASSWORD: "your-relay-password"
  #     # Allow connections from any RFC-1918 or Docker internal address.
  #     MYNETWORKS: "172.16.0.0/12 10.0.0.0/8 127.0.0.0/8"
  #     # Only accept mail from your own domain — adjust to match your From address.
  #     ALLOWED_SENDER_DOMAINS: "yourcompany.com"
  #   networks:
  #     - dependency-track
